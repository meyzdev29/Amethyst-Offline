name: Build APK

on:
  push:
    branches: [main, v3_openjdk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Installer le NDK
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
